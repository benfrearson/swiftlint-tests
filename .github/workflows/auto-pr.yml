name: Create Pull Requests on changes to Development

on:
    pull_request:
      types:
        - closed

jobs:
    merged_development_pr:
      if:  ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'development' }}
      runs-on: ubuntu-latest
      env:
        PR_BRANCH: "auto/${{github.event.pull_request.head.ref}}-into-development"
      steps:
      - uses: actions/checkout@v4
        with:
            ref: ${{github.event.pull_request.head.ref}}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
            token: ${{ secrets.ADD_TO_PROJECT_PAT}} 
            branch: ${PR_BRANCH}

        

