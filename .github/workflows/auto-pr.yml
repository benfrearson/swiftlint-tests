name: Create Pull Requests on changes to Development

on:
    pull_request:
      types:
        - closed

jobs:
    merged_development_pr:
      if:  ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'development' }}
      runs-on: ubuntu-latest
      env:
        PR_BRANCH: "auto/${{github.event.pull_request.head.ref}}-into-development"
      steps:
      - uses: actions/checkout@v4
        with:
            ref: development
      - name: Create PR branch
        run: |
            git switch -C ${{env.PR_BRANCH}}
            git push --set-upstream origin auto/auto-pr-into-development
            gh pr create --base epic/epic1 --title "Auto PR"
